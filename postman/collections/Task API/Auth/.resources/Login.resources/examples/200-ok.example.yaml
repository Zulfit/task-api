$kind: http-example
name: 200 OK
request:
  method: POST
  url: '{{base_url}}/auth/login'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "email": "demo@example.com",
        "password": "password123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "Logged in successfully!",
        "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example"
      }
order: 1000
