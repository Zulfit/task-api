$kind: http-request
name: Register
method: POST
url: '{{base_url}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Register returns 201', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Response includes user without password', function () {
        const body = pm.response.json();
        pm.expect(body).to.have.property('message');
        pm.expect(body).to.have.property('user');
        pm.expect(body.user).to.have.property('id');
        pm.expect(body.user).to.have.property('email');
        pm.expect(body.user).to.not.have.property('password');
      });
examples: './.resources/Register.resources/examples/'
