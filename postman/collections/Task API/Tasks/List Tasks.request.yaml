$kind: http-request
name: List Tasks
method: GET
url: '{{base_url}}/tasks'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('List tasks returns 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response is an array', function () {
        const body = pm.response.json();
        pm.expect(body).to.be.an('array');
      });
