$kind: http-request
name: Delete Task
method: DELETE
url: '{{base_url}}/tasks/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{task_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Delete task returns 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Deleted task is returned', function () {
        const body = pm.response.json();
        pm.expect(body).to.have.property('id', Number(pm.environment.get('task_id')));
      });
